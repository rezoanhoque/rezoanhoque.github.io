<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Disclosure Gap Calculator · M. R. Hoque</title>
<style>
:root{color-scheme:light;--bg:#f7f9fc;--surface:#fff;--ink:#142238;--muted:#586a80;--border:#dce4ef;--blue:#2563eb;--teal:#0d9488;--violet:#7c3aed;--pink:#db2777;--orange:#ea580c;--green:#16834d;--amber:#b7790b;--indigo:#4f46e5;--cyan:#0284c7;--lane1:#edf4ff;--lane2:#f3efff;--lane3:#edf8f5;--shadow:#13284a18}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0c1422;--surface:#142136;--ink:#ecf3ff;--muted:#a9b8cb;--border:#304057;--blue:#70a5ff;--teal:#45ccba;--violet:#b196ff;--pink:#fa8dbc;--orange:#ffae74;--green:#6fda9a;--amber:#ecc66d;--indigo:#a7a2ff;--cyan:#77d3fa;--lane1:#10223b;--lane2:#211c39;--lane3:#122d2c;--shadow:#00000044}}
:root[data-theme=dark]{color-scheme:dark;--bg:#0c1422;--surface:#142136;--ink:#ecf3ff;--muted:#a9b8cb;--border:#304057;--blue:#70a5ff;--teal:#45ccba;--violet:#b196ff;--pink:#fa8dbc;--orange:#ffae74;--green:#6fda9a;--amber:#ecc66d;--indigo:#a7a2ff;--cyan:#77d3fa;--lane1:#10223b;--lane2:#211c39;--lane3:#122d2c;--shadow:#00000044}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:1440px;margin:auto;padding:28px 32px 40px}a{color:var(--blue)}.top{display:flex;justify-content:space-between;align-items:start;gap:24px;margin:24px 0}.top>div:first-child{max-width:850px}h1{font-size:40px;line-height:1.15;margin:0 0 12px;letter-spacing:-1.2px}p{margin:6px 0;color:var(--muted)}.caption{min-width:220px;max-width:320px;text-align:right;padding-top:8px;color:var(--blue);font-weight:600}.badge{display:inline-block;font-size:11px;letter-spacing:.04em;padding:5px 10px;border:1px solid var(--border);border-radius:20px;margin-top:12px;color:var(--muted)}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0}button{font:inherit;font-size:13px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink);padding:8px 14px;cursor:pointer}button:hover{border-color:var(--blue)}button:disabled{opacity:.6;cursor:default}:focus-visible{outline:3px solid var(--cyan);outline-offset:4px}.hint{margin-left:auto;font-size:12px;color:var(--muted)}svg{width:100%;height:auto;display:block;overflow:visible}.lane{stroke:var(--border);stroke-width:1}.lane-label{font-size:13px;font-weight:750;letter-spacing:1px;fill:var(--muted)}.card{cursor:pointer;transform-box:fill-box;transform-origin:center;transition:transform .35s ease,filter .35s ease}.card.active{transform:scale(1.018);filter:drop-shadow(0 4px 9px var(--step))}.card .base{fill:var(--surface);stroke:var(--step);stroke-width:1.5}.card .tint{fill:var(--step);opacity:0;transition:opacity .35s}.card.visited .tint{opacity:.055}.card.active .tint{opacity:.11}.card-title{font-size:19px;font-weight:700;fill:var(--ink)}.body{font-size:14px;fill:var(--muted)}.code{font:12px ui-monospace,SFMono-Regular,Consolas,monospace;fill:var(--step)}.number{font-size:12px;font-weight:700;fill:var(--surface)}.connector{fill:none;stroke-width:2;stroke-dasharray:6 6;animation:flow 1s linear infinite}.paused .connector{animation-play-state:paused}@keyframes flow{to{stroke-dashoffset:-24}}.token{filter:drop-shadow(0 0 7px var(--blue));pointer-events:none}.detail{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 24px;margin-top:18px;box-shadow:0 4px 16px var(--shadow)}.detail h2{font-size:19px;margin:0 0 8px}.detail p{max-width:1100px}.footer{font-size:12px;text-align:center;margin-top:20px}.credit{font-size:12px;color:var(--muted)}@media(max-width:700px){main{padding:20px 16px}.top{display:block}h1{font-size:30px}.caption{text-align:left;max-width:none;padding-top:16px}.hint{width:100%;margin:0}.detail{padding:18px}}@media(prefers-reduced-motion:reduce){.connector,.card,.card .tint{animation:none!important;transition:none!important}.card.active{transform:none;filter:none}.token{display:none}}
</style></head><body><main><a id="back"></a><div class="top"><div><h1>Disclosure Gap Calculator</h1><p id="subtitle"></p><span class="badge" id="status"></span></div><div><div class="caption" id="caption" aria-live="off"></div><p class="credit">Mohammad Rezoanul Hoque · Finance research</p></div></div><div class="toolbar"><button id="play" type="button">Pause</button><button id="theme" type="button">Toggle theme</button><button id="save" type="button">Download HTML</button><span class="hint">Select any step to explore it · ~19-second cycle</span></div><svg id="diagram" role="img" aria-labelledby="svg-title svg-desc"></svg><section class="detail" aria-labelledby="detail-title"><h2 id="detail-title">Explore the pipeline</h2><p id="detail-text">Select a step to read its implementation details. The animation illustrates the workflow; it is not a live job monitor.</p></section><p class="footer" id="footer"></p></main>
<script>
const DATA={"title": "Disclosure Gap Calculator", "subtitle": "From two disclosures to transparent, reproducible comparisons—entirely in your browser.", "status": "Live tool · v1.0 · deterministic word-count measures", "back": "/tools/disclosure-gap/", "backLabel": "Open calculator", "lanes": ["01 · INPUTS & WORD LISTS", "02 · MEASURE EACH DISCLOSURE", "03 · COMPARE & EXPLAIN"], "footer": "A gap describes language differences. It does not prove contradiction, deception, causation, or investment value.", "steps": [["Two disclosures", ["Paste English text or open .txt", "For example: call versus MD&A", "Maximum 200,000 characters each"], "Disclosure A + Disclosure B", "Read the two disclosures", "Inputs stay in browser memory. They are not uploaded or saved by the calculator. Compare equivalent sections and periods; a short fictional example is available in the live tool."], ["Choose word lists", ["Illustrative starter vocabulary", "Or import an official LM CSV", "Positive, negative, uncertainty"], "parseLM() · normalizeList()", "Choose the scoring vocabulary", "The starter lists are not validated research dictionaries. LM imports keep numeric category flags above zero and exclude negative removal-year flags. Users can edit and inspect every list."], ["Normalize & tokenize", ["NFKC normalization; lowercase", "Apostrophes retained; hyphens split", "Number tokens enter the denominator"], "words(text)", "Normalize and count the words", "Matching uses English tokens with no stemming, stop-word removal, context model, or negation adjustment. “Not strong” still matches “strong.” Categories can overlap."], ["Count category hits", ["Exact matches in each category", "Repeated occurrences are counted", "Show the words behind each count"], "analyze(text, lexicon)", "Count the matching words", "Duplicate dictionary entries do not double count a word. The output includes each matched word and its frequency so users can inspect what drives a result."], ["Compute tone rates", ["Rate = 100 × hits / words", "Net tone = positive − negative", "Uncertainty is reported separately"], "positive · negative · uncertainty", "Convert counts to comparable rates", "Rates use all tokens, including numbers, as the denominator. A small denominator can exaggerate a gap; passages with fewer than 100 words are explicitly flagged."], ["Estimate readability", ["English sentence segmentation", "Words per sentence + raw ARI", "Letters and digits count for ARI"], "Intl.Segmenter · ARI", "Estimate reading difficulty", "ARI = 4.71 × characters/words + 0.5 × words/sentences − 21.43. Raw negative scores are retained. Browser sentence segmentation can vary; ARI is not a measure of disclosure quality."], ["Calculate the gaps", ["Always disclosure A minus B", "Tone gaps: percentage points", "ARI gap: index points"], "compare(A, B, lexicon)", "Compare A against B", "Identical inputs yield zero gaps, and swapping inputs reverses the signs. Positive gaps mean A is higher on that measure, not that A is more accurate or more informative."], ["Inspect the evidence", ["Summary cards and detailed table", "Matched words for both disclosures", "Input edits invalidate old results"], "metrics + matches + cautions", "Inspect what drives the differences", "The calculator exposes the underlying counts rather than hiding them behind a score. Users can inspect vocabulary, revise inputs, and recalculate; it does not generate causal interpretations."], ["Export & reproduce", ["JSON: measures, word lists, version", "Input SHA-256 fingerprints", "Original disclosure text excluded"], "disclosure-gap-v1.json", "Save a reproducible results packet", "The export includes active word lists, counts, gaps, tool version, time, and input fingerprints. Keep the original texts separately to reproduce a run. Hash unavailability is explicitly recorded."]]};
const NS='http://www.w3.org/2000/svg',svg=document.getElementById('diagram'),colors=['blue','teal','violet','pink','orange','green','amber','indigo','cyan'];
document.getElementById('subtitle').textContent=DATA.subtitle;document.getElementById('status').textContent=DATA.status;document.getElementById('footer').textContent=DATA.footer;
const back=document.getElementById('back');back.textContent='← '+DATA.backLabel;back.href=DATA.back;
const reduced=matchMedia('(prefers-reduced-motion: reduce)'),mobile=matchMedia('(max-width:700px)');let paused=false,elapsed=0,last=performance.now(),cards=[],paths=[],points=[],token,selected=-1;
function make(tag,attrs={},parent=svg,text=''){const e=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(text)e.textContent=text;parent.append(e);return e;}
function detail(i){selected=i;document.getElementById('detail-title').textContent=(i+1)+'. '+DATA.steps[i][0];document.getElementById('detail-text').textContent=DATA.steps[i][4];}
function select(i){paused=true;elapsed=i*2100+500;detail(i);sync();paint();}
function render(){svg.replaceChildren();cards=[];paths=[];points=[];let small=mobile.matches;svg.setAttribute('viewBox',small?'0 0 420 2530':'0 0 1200 890');make('title',{id:'svg-title'},svg,DATA.title);make('desc',{id:'svg-desc'},svg,'Nine steps in three lanes. Cards are keyboard selectable. Dashed arrows show data flow.');
 const defs=make('defs');colors.forEach((color,i)=>{const m=make('marker',{id:'arrow'+i,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto'},defs);make('path',{d:'M0 0 L10 5 L0 10 Z',fill:'var(--'+color+')'},m);});
 for(let lane=0;lane<3;lane++){let y=small?lane*840:lane*294;make('rect',{x:2,y:y+2,width:small?416:1196,height:small?824:278,rx:18,fill:'var(--lane'+(lane+1)+')',class:'lane'});make('text',{x:small?22:28,y:y+33,class:'lane-label'},svg,DATA.lanes[lane]);}
 DATA.steps.forEach((step,i)=>{const row=Math.floor(i/3),col=row%2?2-i%3:i%3;points.push(small?{x:32,y:row*840+62+(i%3)*246,w:356,h:196}:{x:28+col*400,y:row*294+64,w:344,h:182});});
 points.slice(0,-1).forEach((p,i)=>{const q=points[i+1];let d;if(small||Math.floor(i/3)!==Math.floor((i+1)/3)){const x=p.x+p.w/2;d=Math.floor(i/3)!==Math.floor((i+1)/3)?`M${x} ${p.y+p.h+2} V${p.y+p.h+18} H${p.x+p.w-14} V${q.y-20} H${x} V${q.y-9}`:`M${x} ${p.y+p.h+2} L${x} ${q.y-9}`;}else if(q.x>p.x){d=`M${p.x+p.w+2} ${p.y+p.h/2} L${q.x-9} ${q.y+q.h/2}`;}else{d=`M${p.x-2} ${p.y+p.h/2} L${q.x+q.w+9} ${q.y+q.h/2}`;}paths.push(make('path',{d,class:'connector',stroke:'var(--'+colors[i]+')','marker-end':'url(#arrow'+i+')'}));});
 DATA.steps.forEach((step,i)=>{const p=points[i],g=make('g',{class:'card',tabindex:0,role:'button','aria-label':`Step ${i+1}: ${step[0]}`,style:'--step:var(--'+colors[i]+')'});cards.push(g);make('rect',{x:p.x,y:p.y,width:p.w,height:p.h,rx:12,class:'base'},g);make('rect',{x:p.x,y:p.y,width:p.w,height:p.h,rx:12,class:'tint'},g);make('rect',{x:p.x+1,y:p.y+1,width:p.w-2,height:5,rx:3,fill:'var(--'+colors[i]+')'},g);make('circle',{cx:p.x+p.w-26,cy:p.y+29,r:12,fill:'var(--'+colors[i]+')'},g);make('text',{x:p.x+p.w-26,y:p.y+33,'text-anchor':'middle',class:'number'},g,String(i+1));const title=make('text',{x:p.x+18,y:p.y+36,class:'card-title'},g,step[0]);let size=19;while(title.getComputedTextLength()>p.w-74&&size>12){size--;title.style.fontSize=size+'px';}step[1].forEach((line,j)=>make('text',{x:p.x+18,y:p.y+72+j*23,class:'body'},g,line));make('text',{x:p.x+18,y:p.y+p.h-20,class:'code'},g,step[2]);g.addEventListener('click',()=>select(i));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(i);}});});token=make('circle',{r:6,class:'token',fill:'var(--blue)'});paint();}
 function sync(){document.body.classList.toggle('paused',paused||reduced.matches);document.getElementById('play').textContent=reduced.matches?'Reduced motion':paused?'Play':'Pause';document.getElementById('play').disabled=reduced.matches;}
 function paint(){const i=Math.min(8,Math.floor(elapsed/2100)),phase=elapsed%2100;cards.forEach((c,j)=>{c.classList.toggle('visited',reduced.matches||j<=i);c.classList.toggle('active',!reduced.matches&&j===i);});document.getElementById('caption').textContent=reduced.matches?'Static view · all steps shown':DATA.steps[i][3];if(reduced.matches){token.style.display='none';return;}token.style.display='';let point;if(i<8&&phase>1000){point=paths[i].getPointAtLength(paths[i].getTotalLength()*Math.min(1,(phase-1000)/850));}else{point={x:points[i].x+points[i].w/2,y:points[i].y+3};}token.setAttribute('cx',point.x);token.setAttribute('cy',point.y);token.setAttribute('fill','var(--'+colors[i]+')');}
 function frame(now){if(!paused&&!reduced.matches&&!document.hidden)elapsed=(elapsed+Math.max(0,Math.min(now-last,100)))%18900;last=now;paint();requestAnimationFrame(frame);}
document.getElementById('play').addEventListener('click',()=>{paused=!paused;sync();});document.getElementById('theme').addEventListener('click',()=>{const isDark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;document.documentElement.dataset.theme=isDark?'light':'dark';});document.getElementById('save').addEventListener('click',()=>{const blob=new Blob(['<!doctype html>\n'+document.documentElement.outerHTML],{type:'text/html'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=DATA.title.toLowerCase().replaceAll(' ','-')+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});reduced.addEventListener('change',()=>{sync();paint();});mobile.addEventListener('change',render);render();sync();requestAnimationFrame(frame);
</script></body></html>
